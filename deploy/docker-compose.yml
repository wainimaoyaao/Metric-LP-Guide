name: metric-lp-guide

services:
  metric-lp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: metric-lp-guide:local
    restart: unless-stopped
    environment:
      METRIC_BIND_HOST: "0.0.0.0"
      METRIC_PUBLIC_ORIGIN: "https://metric.dadaowuwei.ccwu.cc"
    volumes:
      - metric-cache:/app/data
    expose:
      - "8767"
    networks:
      proxy:
        aliases:
          - metric-lp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8767/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  metric-cache:

networks:
  proxy:
    external: true
    name: web-proxy
